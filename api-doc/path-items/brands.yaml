no_params:
  get:
    summary: get brand by id
    description: pass brand id in path parameter
    tags:
     - Brands
    parameters:
       - name: brandid
         in: path
         description: id of the brand
         schema:
            type: integer
            example: 2
         required: true
    responses:
      "200":
         $ref: "../main.yaml#/components/responses/OptionsResponse"
      "401":
          $ref: "../main.yaml#/components/responses/Unauthorize"
  
  post:
    description: pass brands data and with the id in path paramter
    summary: update a brand
    tags: 
      - Brands
    parameters:
       - name: brandid
         in: path
         description: id of the brand
         schema:
            type: integer
            example: 2
         required: true
    requestBody:
         
         $ref: "../main.yaml#/components/requestBodies/OptionsRequest"
    responses:
      "200":
        
        $ref: "../main.yaml#/components/responses/OptionsStatusResponse"
      "401":
          $ref: "../main.yaml#/components/responses/Unauthorize"
  delete:
    summary: delete a brand
    description: pass the id of the brand
    tags:
     - Brands
    parameters:
       - name: brandid
         in: path
         description: id of the brand
         schema:
            type: integer
            example: 2
         required: true
    responses:
      "200":
        $ref: "../main.yaml#/components/responses/OptionsStatusResponse"
      "401":
          $ref: "../main.yaml#/components/responses/Unauthorize"
       
      
        
    
    
       
    


params:
   post:
     summary: add brands
     description: pass brand data with post request
     tags:
      - Brands
     requestBody:  
       content:
         application/json:
           schema:
             type: object
             properties:
               name:
                type: string
                example: "Levi's"
     responses:
        "201":
           $ref: "../main.yaml#/components/responses/OptionsResponse"
        "401":
          $ref: "../main.yaml#/components/responses/Unauthorize"    
    

   get:
     summary: Filter sort and paginate Brands
     description: pass filter range and sort parameter with get request
     tags:
      - Brands
     parameters:
         - $ref: "../main.yaml#/components/parameters/Filter"
         - $ref: "../main.yaml#/components/parameters/Range"
         - $ref: "../main.yaml#/components/parameters/Sort"
     responses:
         "200":
           description: operation success
           content:
             application/json:
               schema:
                 type: array
                 items:
                      $ref: "../main.yaml#/components/schemas/Options"
      

         "401":
          $ref: "../main.yaml#/components/responses/Unauthorize"


