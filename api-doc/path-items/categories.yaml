no_params:
  get:
    summary: get category by id
    description: pass category id in path parameter
    tags:
     - Categories
    parameters:
       - name: categoryid
         in: path
         description: id of the category
         schema:
            type: integer
            example: 2
         required: true
    responses:
      "200":
         $ref: "../main.yaml#/components/responses/OptionsResponse"
      "401":
          $ref: "../main.yaml#/components/responses/Unauthorize"
  
  post:
    description: pass category data and with the id in path paramter
    summary: update category
    tags: 
      - Categories
    parameters:
       - name: categoryid
         in: path
         description: id of the category
         schema:
            type: integer
            example: 2
         required: true
    requestBody:
         
         $ref: "../main.yaml#/components/requestBodies/OptionsRequest"
    responses:
      "200":
        
        $ref: "../main.yaml#/components/responses/OptionsStatusResponse"
      "401":
          $ref: "../main.yaml#/components/responses/Unauthorize"
  delete:
    summary: delete a category
    description: pass the id of the category
    tags:
     - Categories
    parameters:
       - name: categoryid
         in: path
         description: id of the category
         schema:
            type: integer
            example: 2
         required: true
    responses:
      "200":
        $ref: "../main.yaml#/components/responses/OptionsStatusResponse"
      "401":
          $ref: "../main.yaml#/components/responses/Unauthorize"
       

params:
   post:
     summary: add category
     description: pass category data with post request
     tags:
      - Categories
     requestBody:  
       content:
         application/json:
           schema:
             type: object
             properties:
               name:
                type: string
                example: "Clothing"
     responses:
        "201":
           $ref: "../main.yaml#/components/responses/OptionsResponse"
        "401":
          $ref: "../main.yaml#/components/responses/Unauthorize"    
    

   get:
     summary: filter sort and paginate categories
     description: pass filter range and sort parameter with get request
     tags:
      - Categories
     parameters:
         - $ref: "../main.yaml#/components/parameters/Filter"
         - $ref: "../main.yaml#/components/parameters/Range"
         - $ref: "../main.yaml#/components/parameters/Sort"
     responses:
         "200":
           content:
             application/json:
               schema:
                 type: array
                 items:
                      $ref: "../main.yaml#/components/schemas/Options"
      

         "401":
          $ref: "../main.yaml#/components/responses/Unauthorize"
    
    
       
    


