params:
  post:
    summary: create items bulk
    description: pass multiple Items
    tags:
      - Items-Bulk
    requestBody:
      content:
        application/json:
           schema:
              $ref: "../main.yaml#/components/schemas/ItemsBulk"
    responses:
      "200":
            description: operation success
            content:
              application/json:
                schema:
                  type: object
                  properties:
                     status:
                        type: string
                        example: "success"
                     message:
                        type: string
                        example: "Successfully Item Updated"
                     Deleted SKU:
                        type: array
                        items:
                           type: integer
                           example: 299
      "401":
            $ref: "../main.yaml#/components/responses/Unauthorize"
