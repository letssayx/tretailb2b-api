no_params:
  get:
    summary:  get a log
    description:  pass log id in path parameter
    tags:
      - Logs
    parameters:
     - name: logid
       description: the id of the log
       in: path
       schema:
         type: integer
         example: 2
       required: true
    responses:
       "200":
         $ref: "../main.yaml#/components/responses/LogsResponse"
       "401":
           $ref: "../main.yaml#/components/responses/Unauthorize"


params:
  get:
    summary: filter sort and paginate Logs
    description: pass filter sort and range parameters with get request
    tags: 
          - Logs
    parameters:
          - $ref: "../main.yaml#/components/parameters/Filter"
          - $ref: "../main.yaml#/components/parameters/Range"
          - $ref: "../main.yaml#/components/parameters/Sort"
    responses:
       "200":
          $ref: "../main.yaml#/components/responses/LogsResponseArray"
       "401":
           $ref: "../main.yaml#/components/responses/Unauthorize"
  

    