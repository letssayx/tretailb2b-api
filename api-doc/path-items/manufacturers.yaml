no_params:
  get:
    summary: get manufacturer by id
    description: pass manufacturer id in path parameter
    tags:
     - Manufacturers
    parameters:
       - name: manufacturerid
         in: path
         description: id of the request
         schema:
            type: integer
            example: 2
         required: true
    responses:
      "200":
         $ref: "../main.yaml#/components/responses/OptionsResponse"
      "401":
          $ref: "../main.yaml#/components/responses/Unauthorize"
  
  post:
    description: pass manufacturer data and with the id in path paramter
    summary: update manufacturer
    tags: 
      - Manufacturers
    parameters:
       - name: manufacturerid
         in: path
         description: id of the request
         schema:
            type: integer
            example: 2
         required: true
    requestBody:
         
         $ref: "../main.yaml#/components/requestBodies/OptionsRequest"
    responses:
      "200":
        
        $ref: "../main.yaml#/components/responses/OptionsStatusResponse"
      "401":
          $ref: "../main.yaml#/components/responses/Unauthorize"
  delete:
    summary: delete a manufacturer
    description: pass the id of the Manufacturers
    tags:
     - Manufacturers
    parameters:
       - name: manufacturerid
         in: path
         description: id of the request
         schema:
            type: integer
            example: 2
         required: true
    responses:
      "200":
        $ref: "../main.yaml#/components/responses/OptionsStatusResponse"
      "401":
          $ref: "../main.yaml#/components/responses/Unauthorize"
       
      
        
    
    
       
    


params:
   post:
     summary: add manufacturer
     description: pass manufacturer data with post request
     tags:
      - Manufacturers
     requestBody:  
       content:
         application/json:
           schema:
             type: object
             properties:
               name:
                type: string
                example: "Levi Strauss India Pvt. Ltd"
     responses:
        "201":
           $ref: "../main.yaml#/components/responses/OptionsResponse"
        "401":
          $ref: "../main.yaml#/components/responses/Unauthorize"    
    

   get:
     summary: filter sort and paginate manufacturers
     description: pass filter range and sort parameter with get request
     tags:
      - Manufacturers
     parameters:
         - $ref: "../main.yaml#/components/parameters/Filter"
         - $ref: "../main.yaml#/components/parameters/Range"
         - $ref: "../main.yaml#/components/parameters/Sort"
     responses:
         "200":
           description: operation success
           content:
             application/json:
               schema:
                 type: array
                 items:
                      $ref: "../main.yaml#/components/schemas/Options"
      

         "401":
          $ref: "../main.yaml#/components/responses/Unauthorize"


