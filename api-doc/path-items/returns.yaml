params:
  get:
    summary: filter sort and paginate returns
    description: pass filter sort and range parameters with get request
    tags:
      - Returns
    parameters:
          - $ref: "../main.yaml#/components/parameters/Filter"
          - $ref: "../main.yaml#/components/parameters/Range"
          - $ref: "../main.yaml#/components/parameters/Sort"
    responses:
       "200":
          $ref: "../main.yaml#/components/responses/ReturnsResponseArray"
       "401":
          $ref: "../main.yaml#/components/responses/Unauthorize"


no_params:
  get:
    summary: get a return
    description: pass return id in path parameter
    tags:
      - Returns
    parameters:
        - name: returnid
          in: path
          description: the id of the return
          schema:
            type: integer
            example: 1
    responses:
       "200":
          $ref: "../main.yaml#/components/responses/ReturnsResponse"
       "401":
          $ref: "../main.yaml#/components/responses/Unauthorize"
  post:
     summary: update return
     description: pass return information
     tags:
       - Returns
     requestBody:
       $ref: "../main.yaml#/components/requestBodies/ReturnsUpdate"
     parameters:
        - name: returnid
          in: path
          description: the id of the return
          schema:
            type: integer
            example: 1
     responses:
       "200":
          description: operation success
          content:
            application/json:
              schema:
                type: object
                properties:
                    status:
                        type: string
                        example: "success"
                    message:
                        type: string
                        example: "Successfully Return Updated"
       "401":
            $ref: "../main.yaml#/components/responses/Unauthorize"