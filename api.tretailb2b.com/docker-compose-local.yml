version: '3'

services:
   #PHP Service
   tretailapi:
     build:
      context: .
      dockerfile: Dockerfile
     image: fuzonmedia/tretailapi
     restart: unless-stopped
     ports:
       - "8080:80"
     volumes:
       - ./app/:/var/www/html
       - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
     working_dir: /var/www/html
     container_name: tretailapi
     networks:
       - nginx-proxy

networks:
  nginx-proxy:
    external: true



