version: '3'

services:
   #PHP Service
   tretail-api:
     build:
      context: .
      dockerfile: Dockerfile
     image: fuzonmedia/tretail-api
     restart: unless-stopped
     ports:
       - "8080:80"
     volumes:
       - ./app/:/var/www/html
       - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
     environment:
       VIRTUAL_HOST: api.tretailb2b.com
       LETSENCRYPT_HOST: api.tretailb2b.com
     working_dir: /var/www/html
     container_name: tretail-api
     networks:
       - nginx-proxy

networks:
  nginx-proxy:
    external: true



