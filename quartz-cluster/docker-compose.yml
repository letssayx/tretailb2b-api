version: '3'
services:

  jobnode:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile
      args:
        JAR_FILE: target/app.jar
        UTIL_DIR: src/main/docker/
    ports:
      - "7080:8080"
    container_name: jobnode
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m -D
    networks:
      - nginx-proxy

